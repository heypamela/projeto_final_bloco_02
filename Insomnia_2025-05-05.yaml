    scripts:
      preRequest: >-
        let host = insomnia.collectionVariables.get("host");

        let username = insomnia.collectionVariables.get("username");

        let password = insomnia.collectionVariables.get("password");


        let body = JSON.stringify({
            "username": username,
            "password": password
        })


        const postRequest = {
          url: host + '/logar',
          method: 'POST',
          timeout: 0,
          header: {
            "Content-Type": "application/json",
            "Accept": "*/*"
          },
          body: body
        };

        insomnia.sendRequest(postRequest, function (err, res) {
            console.log("Login Response: ", res);
            if (err) console.log("Error: ", err)
            let authorization = res.headers.get('Authorization')
            insomnia.collectionVariables.set('authorization_token', authorization);
        });
